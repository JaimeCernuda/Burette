<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Burette</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --accent: #0071e3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --fg: #f5f5f7; --muted: #a1a1a6; --line: #38383a; --accent: #2997ff; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #shell { display: flex; flex-direction: column; height: 560px; }
  html[data-display-mode="fullscreen"] #shell { height: 100vh; }
  header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); min-height: 28px; flex-wrap: wrap; }
  #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  #status { color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status[data-kind="error"] { color: #d70015; }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #frames { display: flex; align-items: center; gap: 6px; }
  #frames[hidden] { display: none; }
  #frame { width: 140px; }
  #frame-label { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 56px; }
  #stage-wrap { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; inset: 0; }
  #overlay { position: fixed; inset: 0; cursor: crosshair; z-index: 50; background: rgba(0, 113, 227, 0.04); }
  #overlay[hidden], #box[hidden] { display: none; }
  #overlay[data-mode="move"] { cursor: move; background: rgba(0, 113, 227, 0.02); }
  #edit-panel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--bg); }
  #edit-panel[hidden], #edit-panel [hidden] { display: none; }
  #edit-info { flex: 1 1 220px; font-variant-numeric: tabular-nums; }
  #edit-slider { flex: 1 1 160px; }
  #edit-value { width: 80px; font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
  #box { position: fixed; border: 1.5px solid var(--accent); background: rgba(0, 113, 227, 0.12); z-index: 51; pointer-events: none; }
  .msp-plugin { font-size: 12px; }
  /* Narrow views (a phone): Mol*'s centred selection toolbar runs under the viewport
     controls column on the right; keep it clear of that column and let it scroll. */
  @media (max-width: 560px) {
    .msp-selection-viewport-controls {
      left: 4px !important; right: 44px !important; transform: none !important;
      max-width: none !important; overflow-x: auto; white-space: nowrap;
    }
  }
</style>
</head>
<body>
<div id="shell">
  <header>
    <span id="title">Burette</span>
    <span id="status" role="status"></span>
    <span id="frames" hidden>
      <button id="play" type="button">Play</button>
      <input id="frame" type="range" min="0" max="0" value="0" aria-label="Frame" />
      <span id="frame-label">1 / 1</span>
    </span>
    <button id="edit" type="button" aria-pressed="false" title="Change a bond, angle or dihedral, or drag an atom">Edit</button>
    <button id="region" type="button" aria-pressed="false" title="Draw a rectangle to select the atoms under it">Region</button>
    <button id="reset" type="button" title="Reset camera">Reset</button>
  </header>
  <div id="edit-panel" hidden>
    <span id="edit-info"></span>
    <input id="edit-slider" type="range" aria-label="New value" hidden />
    <input id="edit-value" type="number" step="any" aria-label="New value" hidden />
    <button id="edit-apply" type="button" hidden>Apply</button>
    <button id="edit-move" type="button" aria-pressed="false" hidden>Drag atom</button>
  </div>
  <div id="stage-wrap">
    <div id="stage"></div>
  </div>
</div>
<div id="overlay" hidden></div>
<div id="box" hidden></div>
<script>/*APP*/</script>
</body>
</html>
