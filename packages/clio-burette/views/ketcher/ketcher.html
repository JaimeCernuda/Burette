<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Burette Ketcher</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: #ffffff; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { html, body { background: #000000; color: #f5f5f7; } }
  #shell { display: flex; flex-direction: column; height: 600px; }
  html[data-display-mode="fullscreen"] #shell { height: 100vh; }
  #status { padding: 4px 10px; color: #6e6e73; border-bottom: 1px solid rgba(128,128,128,.3); min-height: 18px; }
  #status[data-kind="error"] { color: #d70015; }
  #root { flex: 1; min-height: 0; position: relative; }
</style>
</head>
<body>
<div id="shell">
  <div id="status" role="status"></div>
  <div id="root"></div>
</div>
<script>/*APP*/</script>
</body>
</html>
