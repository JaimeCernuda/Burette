pre-commit:
  parallel: true
  commands:
    js-syntax:
      run: bun run check:js
    rust-fmt:
      run: bun run check:rust:fmt
    plist:
      # plutil ships only with macOS; elsewhere say so instead of failing every commit.
      run: >-
        if ! command -v plutil >/dev/null 2>&1; then
        echo "plist lint skipped: plutil is macOS-only and not on PATH"; exit 0; fi;
        plutil -lint apps/desktop/src-tauri/AppMetadata.plist apps/desktop/src-tauri/Info.plist PreviewExtension/Info.plist PreviewExtension/BurettePreview.entitlements

pre-push:
  commands:
    # Hosted CI runs ci:fast for every PR; running it here too took about
    # eight minutes of this Mac per push. Only the instant version check stays.
    release-version:
      run: bun run check:release
